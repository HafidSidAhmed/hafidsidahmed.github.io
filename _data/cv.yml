    Experience:
      - company: CEA Leti / Clinatec
        position: PhD Researcher in Signal Processing and Computational Neuroscience
        location: Grenoble, France
        start_date: 2022
        end_date: 2026
        summary: Research on M/EEG biomarkers of hypnotic trance and altered states of consciousness, combining experimental neuroscience, signal processing, and machine learning.
        highlights:
          - Designed and conducted M/EEG experiments investigating auditory processing, hypnosis, distraction, and consciousness.
          - Developed Python/Matlab pipelines for M/EEG preprocessing, time-frequency analysis, connectivity, statistical analysis, and source localization.
          - Applied machine learning and deep learning methods to brain-signal decoding and state classification.
          - Worked with simultaneous MEG and EEG recordings, including auditory oddball paradigms.
          - Collaborated with researchers, physicians, engineers, and other multidisciplinary stakeholders.
          - Contributed to scientific publications, conference presentations, and research communications.

      - company: Clinatec
        position: Research Engineer Intern – Brain-Computer Interfaces
        location: Grenoble, France
        start_date: 2022
        end_date: 2022
        summary: Development and optimization of algorithms for a brain-computer interface controlling an exoskeleton using intracortical/ECoG neural recordings.
        highlights:
          - Worked on post-processing algorithms for neural decoding in a clinical brain-computer interface.
          - Developed target-estimation and optimization methods to improve control performance.
          - Contributed to real-time experiments involving a tetraplegic participant and an upper-limb exoskeleton.
          - Collaborated with researchers and engineers in a multidisciplinary neurotechnology environment.
          - Contributed to the patent “Interface neuronale directe…” (2024).

      - company: ST Engineering iDirect
        position: Signal Processing / FPGA Engineering Intern
        location: Belgium
        start_date: 2021
        end_date: 2021
        summary: Development and testing of FPGA-based satellite communication signal-processing solutions.
        highlights:
          - Worked on satellite signal decoding and digital signal-processing algorithms.
          - Developed and tested C/C++ code for FPGA-related applications.
          - Gained experience in embedded systems, hardware/software integration, and engineering workflows.
          - Used cloud-based development and computing environments.
